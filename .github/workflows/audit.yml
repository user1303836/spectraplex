name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at midnight UTC
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/audit.toml"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".cargo/audit.toml"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify unused-RSA exception remains valid
        run: |
          tree=$(cargo tree --locked -i rsa --target all)
          test -z "$tree"
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
