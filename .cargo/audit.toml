# Narrow upstream exceptions; review when the dependency tree changes.
[advisories]
ignore = [
    # Optional sqlx-mysql resolution only. `cargo tree -i rsa --target all`
    # has no active path: this PostgreSQL-only application does not build RSA.
    # No patched rsa 0.9 release is available.
    "RUSTSEC-2023-0071",

    # alloy-provider 1.7.1 uses lru 0.16.4 with u64 and B256 keys.
    # Neither key has a Drop implementation. The advisory requires a key's
    # Drop to panic during pop(), followed by catch_unwind and cache reuse.
    # Revisit when Alloy adopts lru >=0.18.2; do not add panicking cache keys.
    "RUSTSEC-2026-0253",
]
