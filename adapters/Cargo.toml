[package]
name = "spectraplex-adapters"
version = "0.1.0"
edition = "2021"

[dependencies]
spectraplex-core = { path = "../core" }
yellowstone-grpc-client = "10.2.0"
yellowstone-grpc-proto = "10.1.1"
solana-sdk = "3.0.0"
solana-transaction-status = "3.0.0"
solana-client = "3.0.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
bs58 = "0.5"
uuid = { version = "1.19.0", features = ["v4", "v5", "serde"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "chrono", "json", "bigdecimal"] }
chrono = { version = "0.4.42", features = ["serde"] }
bigdecimal = "0.4.9"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
alloy = { version = "1", features = ["provider-http", "rpc-types"] }
governor = "0.7"
